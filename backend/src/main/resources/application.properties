spring.application.name=cursos-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=8081

# Lee las variables del archivo "env" de la raíz del repo (no se sube a git).
# El formato CLAVE=valor del env es compatible con .properties.
spring.config.import=optional:file:../.env[.properties]

# --- Flowable (API REST del motor que corre en Docker) ---
flowable.rest.url=${FLOWABLE_REST_URL:http://localhost:8080/flowable-ui/process-api}
flowable.rest.usuario=${FLOWABLE_REST_USUARIO}
flowable.rest.clave=${FLOWABLE_REST_CLAVE}
# Id del proceso en el BPMN (hoy "process"; si Alejo lo cambia, se cambia solo acá)
flowable.proceso.clave=${FLOWABLE_PROCESO_CLAVE:process}


# --- BD institucional (misma instancia de Postgres que Flowable, otra base) ---
spring.datasource.url=${INSTITUCION_DB_URL:jdbc:postgresql://localhost:5433/institucion}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# Hibernate crea y actualiza las tablas a partir de las entidades.
# (La V3 del enunciado ya no pide entregar scripts SQL.)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# En Docker esta ruta se monta sobre un volumen persistente con permisos del backend.
app.almacenamiento.propuestas=${CURSOS_PROPUESTAS_DIR:almacenamiento/propuestas}


# --- Sesión (cookie JSESSIONID) ---
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Identidad en Flowable (usuarios y grupos) ---
flowable.rest.identidad-url=${FLOWABLE_IDENTIDAD_URL:http://localhost:8080/flowable-ui/process-api/identity}

# IDs de grupos y jefes tal como están en Flowable IDM y en el BPMN
cursos.grupo.administracion=${GRUPO_ADMINISTRACION:Equipo-Administrativo}
cursos.grupo.docentes=${GRUPO_DOCENTES:Equipo-Docente}
cursos.usuario.jefe-administrativo=${JEFE_ADMINISTRATIVO:Jefe-Administrativo}
cursos.usuario.jefe-docente=${JEFE_DOCENTE:Jefe-Docente}

# Crea una empresa de prueba (empresa-demo / 1234) al arrancar. Solo para desarrollo.
cursos.datos-demo=${CURSOS_DATOS_DEMO:false}
